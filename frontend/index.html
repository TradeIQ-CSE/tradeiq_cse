<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeIQ CSE</title>
    <script>
      // Applied before first paint so the resolved theme (light, dark, or the
      // OS preference under "system") never flashes the wrong one on load.
      // Mirrors src/theme/ThemeProvider.tsx's storage key and resolution
      // logic — keep the two in sync if either changes.
      (function () {
        try {
          var pref = localStorage.getItem("tradeiq:theme-preference");
          var resolved =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          // Storage blocked or unavailable — falls through to the light default below.
        }
      })();
    </script>
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background-color: #f8fafc;
        color: #0f172a;
      }
      html.dark body {
        background-color: #0b1120;
        color: #f8fafc;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .ant-layout-sider-children::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .ant-layout-sider-children {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
