name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: node (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: "@tradeiq/market-trading"
            directory: services/market-trading
          - workspace: "@tradeiq/identity-auth"
            directory: services/identity-auth
          - workspace: "@tradeiq/frontend"
            directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml

      - run: pnpm --dir ${{ matrix.directory }} install --frozen-lockfile

      - name: Public API edge smoke regression tests
        if: matrix.workspace == '@tradeiq/market-trading'
        run: |
          node --test scripts/public-api-smoke.test.mjs
          bash scripts/public-api-proxy-test.sh
          node --test scripts/local-tools.test.mjs
          node --test scripts/release-manifest.test.mjs
          bash scripts/publish-release.test.sh

      - name: Auth session cookie proxy regression
        if: matrix.workspace == '@tradeiq/identity-auth'
        run: bash scripts/auth-session-proxy-test.sh

      - name: Check bundled public API reference
        if: matrix.workspace == '@tradeiq/market-trading'
        run: pnpm --dir services/market-trading run api:reference:check

      - run: pnpm --dir ${{ matrix.directory }} run lint
      - run: pnpm --dir ${{ matrix.directory }} run typecheck
      - run: pnpm --dir ${{ matrix.directory }} run build
      - run: pnpm --dir ${{ matrix.directory }} run test

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/ml-prediction
          - pipeline/data-ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: uv run --frozen --all-groups ruff check .

      - name: Test
        working-directory: ${{ matrix.service }}
        run: uv run --frozen --all-groups pytest

      - name: Build and check the lightweight ML read API
        if: matrix.service == 'services/ml-prediction'
        run: |
          docker build --tag tradeiq-ml-api-ci services/ml-prediction
          docker run --rm --network none tradeiq-ml-api-ci python -c 'import importlib.util; import app.main; assert importlib.util.find_spec("numpy") is None; assert importlib.util.find_spec("xgboost") is None'

      - name: Build and check the ML batch runtime
        if: matrix.service == 'services/ml-prediction'
        run: |
          docker build --tag tradeiq-ml-batch-ci --file services/ml-prediction/Dockerfile.long-trade services/ml-prediction
          docker run --rm --network none tradeiq-ml-batch-ci python -c 'import os; import app.long_trade.main; assert os.getuid() == 10001'

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      # Single Postgres instance, same as docker-compose; per-service
      # databases and users are created from docker/db/init.sql below.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@localhost:5432/market_data
      MARKET_INGESTION_TOKEN: test-only-market-ingestion-token
      AUTH_DATABASE_URL: postgresql://auth:changeme@localhost:5432/auth
      # 32 zero bytes, base64. Test-only: CI never stores a real address.
      AUTH_EMAIL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_REFRESH_COOKIE_SECURE: "false"
      ML_DATABASE_URL: postgresql://ml:changeme@localhost:5432/ml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate an access-token keypair for this run
        run: |
          node -e "
            const { generateKeyPairSync } = require('crypto');
            const { privateKey, publicKey } = generateKeyPairSync('rsa', { modulusLength: 2048 });
            const b64 = (k, type) =>
              Buffer.from(k.export({ type, format: 'pem' })).toString('base64');
            console.log('AUTH_JWT_PRIVATE_KEY=' + b64(privateKey, 'pkcs8'));
            console.log('AUTH_JWT_PUBLIC_KEYS=' + b64(publicKey, 'spki'));
          " >> "$GITHUB_ENV"

      - name: Create per-service databases and users
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:changeme@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/db/init.sql

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            services/market-trading/pnpm-lock.yaml
            services/identity-auth/pnpm-lock.yaml

      - run: |
          pnpm --dir services/market-trading install --frozen-lockfile
          pnpm --dir services/identity-auth install --frozen-lockfile

      - name: TypeORM migrations (market-trading)
        working-directory: services/market-trading
        run: pnpm run migration:run

      - name: TypeORM migrations (identity-auth)
        working-directory: services/identity-auth
        run: pnpm run migration:run

      - name: Identity-auth API E2E
        working-directory: services/identity-auth
        run: pnpm run test:e2e --runInBand

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Alembic migrations (ml-prediction)
        working-directory: services/ml-prediction
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups alembic upgrade head

      # ML write idempotency, completed-result selection and read-only transactions.
      # Required here, so a missing database fails rather than skips.
      - name: ML write and read repository tests against the database
        working-directory: services/ml-prediction
        env:
          ML_TEST_DATABASE_URL: ${{ env.ML_DATABASE_URL }}
          ML_REQUIRE_DB_TESTS: "1"
        run: uv run --frozen --all-groups pytest tests/test_long_trade_repository.py tests/test_read_repository.py

      - name: Assert 28 tables across the three schemas
        run: |
          MD=$(psql "$MARKET_DATA_DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='market_data'")
          AU=$(psql "$AUTH_DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='auth'")
          ML=$(psql "$ML_DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='ml'")
          echo "market_data=$MD auth=$AU ml=$ML"
          TOTAL=$((MD + AU + ML))
          echo "total=$TOTAL"
          test "$TOTAL" -ge 28

  seed:
    name: market-data seed loads and is idempotent
    runs-on: ubuntu-latest
    services:
      # Single Postgres instance, same as docker-compose; per-service
      # databases and users are created from docker/db/init.sql below.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # env.validation.ts only requires REDIS_URL to be set and well formed;
      # boot itself does not need Redis reachable. This service container
      # gives the Redis e2e suite below a real Redis to run against.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@localhost:5432/market_data
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@localhost:5432/market_data
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate an access-token keypair for this run
        run: |
          node -e "
            const { generateKeyPairSync } = require('crypto');
            const { privateKey, publicKey } = generateKeyPairSync('rsa', { modulusLength: 2048 });
            const b64 = (k, type) =>
              Buffer.from(k.export({ type, format: 'pem' })).toString('base64');
            console.log('AUTH_JWT_PRIVATE_KEY=' + b64(privateKey, 'pkcs8'));
            console.log('AUTH_JWT_PUBLIC_KEYS=' + b64(publicKey, 'spki'));
          " >> "$GITHUB_ENV"

      - name: Create per-service databases and users
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:changeme@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/db/init.sql

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: services/market-trading/pnpm-lock.yaml

      - run: pnpm --dir services/market-trading install --frozen-lockfile

      - name: TypeORM migrations (market-trading)
        working-directory: services/market-trading
        run: pnpm run migration:run

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      # These empty the market tables before and after each test, so they run
      # before the sample is imported for the steps below.
      - name: Release importer tests against the database
        working-directory: pipeline/data-ingestion
        env:
          DATA_INGESTION_TEST_DATABASE_URL: ${{ env.DATA_INGESTION_MARKET_DATA_DATABASE_URL }}
          DATA_INGESTION_REQUIRE_DB_TESTS: "1"
        run: |
          uv sync --all-groups
          uv run pytest tests/test_release_import_db.py

      - name: Published developer examples against disposable fixtures
        working-directory: services/market-trading
        env:
          PUBLIC_API_REFERENCE_FIXTURE_TESTS: '1'
        run: pnpm run test:e2e --runInBand public-api-examples.e2e-spec.ts

      - name: Import the bundled sample twice
        working-directory: pipeline/data-ingestion
        run: |
          uv run python -m data_ingestion.release_import
          uv run python -m data_ingestion.release_import

      - name: Assert seed data present and identical across runs
        run: |
          Q="SELECT (SELECT count(*) FROM market_data.securities) || ',' ||
                    (SELECT count(*) FROM market_data.daily_prices) || ',' ||
                    (SELECT count(*) FROM market_data.trading_calendar) || ',' ||
                    (SELECT count(*) FROM market_data.index_values) || ',' ||
                    (SELECT count(*) FROM market_data.ingestion_runs) || ',' ||
                    (SELECT count(*) FROM market_data.price_aggregates) || ',' ||
                    (SELECT count(*) FROM market_data.securities WHERE cse_code = symbol)"
          COUNTS=$(psql "$DATA_INGESTION_MARKET_DATA_DATABASE_URL" -tAc "$Q")
          echo "counts=$COUNTS"
          # One run and 18 aggregate rows after two seed executions proves
          # regeneration is idempotent; every canonical symbol is its CSE code.
          test "$COUNTS" = "6,42,7,14,1,18,6"

      - name: Market API E2E against seeded data
        working-directory: services/market-trading
        run: pnpm run test:e2e --runInBand

  compose-smoke:
    name: docker compose smoke
    runs-on: ubuntu-latest
    needs: [node, python, migrations, seed]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SMOKE_PROJECT_NAME: tradeiq-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run isolated Compose smoke test
        env:
          SMOKE_LOG_DIR: ${{ runner.temp }}/tradeiq-compose-smoke
        run: bash scripts/compose-smoke.sh

      - name: Clean up smoke project
        if: always()
        continue-on-error: true
        run: >-
          docker compose
          --project-name "$SMOKE_PROJECT_NAME"
          --file docker-compose.yml
          --file docker-compose.smoke.yml
          down --volumes --remove-orphans --timeout 10

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tradeiq-compose-smoke
          if-no-files-found: warn
          retention-days: 7
