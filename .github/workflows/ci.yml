name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: node (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@tradeiq/market-trading"
          - "@tradeiq/identity-auth"
          - "@tradeiq/frontend"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ${{ matrix.workspace }} run lint
      - run: pnpm --filter ${{ matrix.workspace }} run typecheck
      - run: pnpm --filter ${{ matrix.workspace }} run build
      - run: pnpm --filter ${{ matrix.workspace }} run test

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/ml-prediction
          - pipeline/data-ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --all-groups

      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: uv run ruff check .

      - name: Test
        working-directory: ${{ matrix.service }}
        run: uv run pytest

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      # Single Postgres instance, same as docker-compose; per-service
      # databases and users are created from docker/db/init.sql below.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@localhost:5432/market_data
      MARKET_INGESTION_TOKEN: test-only-market-ingestion-token
      AUTH_DATABASE_URL: postgresql://auth:changeme@localhost:5432/auth
      # The published development keypair from .env.example. NODE_ENV is unset
      # here, so the production-only rejection of that pair does not apply.
      AUTH_JWT_PRIVATE_KEY: 
      AUTH_JWT_PUBLIC_KEYS: 
      # 32 zero bytes, base64. Test-only: CI never stores a real address.
      AUTH_EMAIL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_REFRESH_COOKIE_SECURE: "false"
      ML_DATABASE_URL: postgresql://ml:changeme@localhost:5432/ml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create per-service databases and users
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:changeme@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/db/init.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeORM migrations (market-trading)
        working-directory: services/market-trading
        run: pnpm run migration:run

      - name: TypeORM migrations (identity-auth)
        working-directory: services/identity-auth
        run: pnpm run migration:run

      - name: Identity-auth API E2E
        working-directory: services/identity-auth
        run: pnpm run test:e2e --runInBand

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Alembic migrations (ml-prediction)
        working-directory: services/ml-prediction
        run: |
          uv sync --all-groups
          uv run alembic upgrade head

      - name: Assert 28 tables across the three schemas
        run: |
          MD=$(psql "$MARKET_DATA_DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='market_data'")
          AU=$(psql "$AUTH_DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='auth'")
          ML=$(psql "$ML_DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='ml'")
          echo "market_data=$MD auth=$AU ml=$ML"
          TOTAL=$((MD + AU + ML))
          echo "total=$TOTAL"
          test "$TOTAL" -ge 28

  seed:
    name: market-data seed loads and is idempotent
    runs-on: ubuntu-latest
    services:
      # Single Postgres instance, same as docker-compose; per-service
      # databases and users are created from docker/db/init.sql below.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@localhost:5432/market_data
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@localhost:5432/market_data
      # The Market API E2E step below boots market-trading, which refuses to
      # start without a public key to verify access tokens against.
      AUTH_JWT_PUBLIC_KEYS: 
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create per-service databases and users
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:changeme@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/db/init.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeORM migrations (market-trading)
        working-directory: services/market-trading
        run: pnpm run migration:run

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Seed twice with the bundled sample fixture
        working-directory: pipeline/data-ingestion
        run: |
          uv sync --all-groups
          uv run python -m data_ingestion.seed
          uv run python -m data_ingestion.seed

      - name: Assert seed data present and identical across runs
        run: |
          Q="SELECT (SELECT count(*) FROM market_data.securities) || ',' ||
                    (SELECT count(*) FROM market_data.daily_prices) || ',' ||
                    (SELECT count(*) FROM market_data.trading_calendar) || ',' ||
                    (SELECT count(*) FROM market_data.index_values) || ',' ||
                    (SELECT count(*) FROM market_data.ingestion_runs) || ',' ||
                    (SELECT count(*) FROM market_data.price_aggregates) || ',' ||
                    (SELECT count(*) FROM market_data.securities WHERE cse_code = symbol)"
          COUNTS=$(psql "$DATA_INGESTION_MARKET_DATA_DATABASE_URL" -tAc "$Q")
          echo "counts=$COUNTS"
          # One run and 18 aggregate rows after two seed executions proves
          # regeneration is idempotent; every canonical symbol is its CSE code.
          test "$COUNTS" = "6,42,7,14,1,18,6"

      - name: Market API E2E against seeded data
        working-directory: services/market-trading
        run: pnpm run test:e2e --runInBand

  compose-smoke:
    name: docker compose smoke
    runs-on: ubuntu-latest
    needs: [node, python, migrations, seed]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SMOKE_PROJECT_NAME: tradeiq-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run isolated Compose smoke test
        env:
          SMOKE_LOG_DIR: ${{ runner.temp }}/tradeiq-compose-smoke
        run: pnpm smoke:compose

      - name: Clean up smoke project
        if: always()
        continue-on-error: true
        run: >-
          docker compose
          --project-name "$SMOKE_PROJECT_NAME"
          --file docker-compose.yml
          --file docker-compose.smoke.yml
          down --volumes --remove-orphans --timeout 10

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tradeiq-compose-smoke
          if-no-files-found: warn
          retention-days: 7
