name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Finish publication rather than cancelling it halfway through promotion.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PUBLIC_ORIGIN: https://tradeiqcse.tech

jobs:
  verify:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: market-trading
            context: services/market-trading
          - service: identity-auth
            context: services/identity-auth
          - service: ml-prediction
            context: services/ml-prediction
          - service: frontend
            context: frontend
          - service: data-ingestion
            context: pipeline/data-ingestion
          - service: ml-long-trade
            context: services/ml-prediction
            dockerfile: Dockerfile.long-trade
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/$SERVICE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile || 'Dockerfile' }}
          push: true
          # Unique candidates cannot replace a previously completed commit tag.
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VITE_MARKET_TRADING_API_URL=${{ env.PUBLIC_ORIGIN }}/api/market
            VITE_IDENTITY_AUTH_API_URL=${{ env.PUBLIC_ORIGIN }}/api/auth
            VITE_ML_PREDICTION_API_URL=${{ env.PUBLIC_ORIGIN }}/api/ml
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record image digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/release-manifest.mjs image "$SERVICE" "$IMAGE_DIGEST" "$RUNNER_TEMP/$SERVICE.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-images
          merge-multiple: true

      - name: Assemble complete release
        run: node scripts/release-manifest.mjs release "$RUNNER_TEMP/release-images" "$RUNNER_TEMP/release.json"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh "$RUNNER_TEMP/release.json"
