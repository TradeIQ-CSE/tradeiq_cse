name: tradeiq-cse

services:
  # Single Postgres instance hosting one database per service.
  # Databases and users are created by docker/db/init.sql on first boot.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Nest API services apply their own TypeORM migrations at startup
  # (migrationsRun: true) before serving traffic. market-trading's healthcheck
  # doubles as the "market_data schema is ready" signal for the seed job.

  market-trading:
    image: tradeiq/market-trading
    build:
      context: .
      dockerfile: services/market-trading/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MARKET_TRADING_PORT: ${MARKET_TRADING_PORT:-3001}
      MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      MARKET_TRADING_CORS_ORIGINS: ${MARKET_TRADING_CORS_ORIGINS:-http://localhost:5173}
      MARKET_INGESTION_TOKEN: ${MARKET_INGESTION_TOKEN:-}
      # Verification only: the public half of the key identity-auth signs with,
      # so nothing in this container can mint a token.
      AUTH_JWT_PUBLIC_KEYS: ${AUTH_JWT_PUBLIC_KEYS:-}
    ports:
      - "${MARKET_TRADING_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  market-data-seed:
    build:
      context: .
      dockerfile: pipeline/data-ingestion/Dockerfile
    command: ["python", "-m", "data_ingestion.seed"]
    # A host bundle is bind-mounted at /seed; CSE_SEED_DATA_DIR is rewritten to
    # that container path so the host path never leaks inside. With the var
    # unset, the mount falls back to the sample fixture and the empty
    # CSE_SEED_DATA_DIR makes seed.py use its own bundled copy anyway.
    volumes:
      - ${CSE_SEED_DATA_DIR:-./pipeline/data-ingestion/src/data_ingestion/fixtures/sample}:/seed:ro
    environment:
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      CSE_SEED_DATA_DIR: ${CSE_SEED_DATA_DIR:+/seed}
      CSE_DATA_SOURCE_URL: ${CSE_DATA_SOURCE_URL:-}
    depends_on:
      market-trading:
        condition: service_healthy
    restart: "no"

  identity-auth:
    image: tradeiq/identity-auth
    build:
      context: .
      dockerfile: services/identity-auth/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      IDENTITY_AUTH_PORT: ${IDENTITY_AUTH_PORT:-3002}
      AUTH_DATABASE_URL: postgresql://auth:changeme@db:5432/auth
      # The private half of the pair market-trading verifies with. Kept to this
      # container alone; a verifier never sees it.
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_EMAIL_ENCRYPTION_KEY: ${AUTH_EMAIL_ENCRYPTION_KEY:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaShouldChange=}
      # Compose serves plain HTTP, where a Secure cookie never reaches the app.
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      # Derived from FRONTEND_PORT so moving the frontend does not silently
      # break every browser call: credentials: true forbids a wildcard origin,
      # so this list has to name the real one.
      IDENTITY_AUTH_CORS_ORIGINS: ${IDENTITY_AUTH_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173}}
    ports:
      - "${IDENTITY_AUTH_PORT:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy

  ml-prediction-migrate:
    image: tradeiq/ml-prediction
    build:
      context: .
      dockerfile: services/ml-prediction/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      ML_DATABASE_URL: postgresql://ml:changeme@db:5432/ml
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ml-prediction:
    image: tradeiq/ml-prediction
    build:
      context: .
      dockerfile: services/ml-prediction/Dockerfile
    environment:
      ML_PREDICTION_PORT: ${ML_PREDICTION_PORT:-8001}
      ML_DATABASE_URL: postgresql://ml:changeme@db:5432/ml
    ports:
      - "${ML_PREDICTION_PORT:-8001}:8001"
    depends_on:
      ml-prediction-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Build args, not `environment`: Vite bakes these into the bundle when
      # the image is built, and the runtime stage only serves static files.
      # These are browser-visible origins, so nothing secret belongs here.
      args:
        VITE_MARKET_TRADING_API_URL: ${VITE_MARKET_TRADING_API_URL:-http://localhost:3001}
        VITE_IDENTITY_AUTH_API_URL: ${VITE_IDENTITY_AUTH_API_URL:-http://localhost:3002}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - market-trading
      - identity-auth

  data-ingestion:
    build:
      context: .
      dockerfile: pipeline/data-ingestion/Dockerfile
    profiles: ["pipeline"]
    environment:
      # Legacy/local seed-compatible profile. Recurring EOD collection runs in
      # cse-dataset and reaches this stack only through the ingestion API.
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      CSE_DATA_SOURCE_URL: ${CSE_DATA_SOURCE_URL:-}
    depends_on:
      market-trading:
        condition: service_healthy

volumes:
  db-data:
