# Local stack: build applications from source and retain database data in db-data.
name: tradeiq-cse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--save", "",
        "--appendonly", "no",
        "--maxmemory", "64mb",
        "--maxmemory-policy", "volatile-ttl",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  market-trading:
    build:
      context: ./services/market-trading
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MARKET_TRADING_PORT: 3001
      MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      MARKET_TRADING_CORS_ORIGINS: ${MARKET_TRADING_CORS_ORIGINS:-http://localhost:5173}
      MARKET_INGESTION_TOKEN: ${MARKET_INGESTION_TOKEN:-}
      BACKTEST_MAX_DATE: ${BACKTEST_MAX_DATE:-2025-12-31}
      PUBLIC_API_HOURLY_LIMIT: ${PUBLIC_API_HOURLY_LIMIT:-100}
      REDIS_URL: redis://redis:6379
      AUTH_JWT_PUBLIC_KEYS: ${AUTH_JWT_PUBLIC_KEYS:?copy .env.example to .env}
    ports:
      - "${MARKET_TRADING_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Import the bundled sample, or the release named by CSE_DATASET_ARTIFACT.
  market-data-seed:
    build:
      context: ./pipeline/data-ingestion
    command: ["python", "-m", "data_ingestion.release_import"]
    environment:
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      CSE_DATASET_ARTIFACT: ${CSE_DATASET_ARTIFACT:-}
    depends_on:
      market-trading:
        condition: service_healthy
    restart: "no"

  identity-auth:
    build:
      context: ./services/identity-auth
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      IDENTITY_AUTH_PORT: 3002
      AUTH_DATABASE_URL: postgresql://auth:changeme@db:5432/auth
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?copy .env.example to .env}
      AUTH_EMAIL_ENCRYPTION_KEY: ${AUTH_EMAIL_ENCRYPTION_KEY:?copy .env.example to .env}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-5m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-15d}
      IDENTITY_AUTH_CORS_ORIGINS: ${IDENTITY_AUTH_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173}}
    ports:
      - "${IDENTITY_AUTH_PORT:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy

  # Apply ML migrations before starting its API.
  ml-prediction-migrate:
    build:
      context: ./services/ml-prediction
    command: ["alembic", "upgrade", "head"]
    environment:
      ML_DATABASE_URL: postgresql://ml:changeme@db:5432/ml
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ml-prediction:
    build:
      context: ./services/ml-prediction
    environment:
      ML_PREDICTION_PORT: 8001
      ML_DATABASE_URL: postgresql://ml:changeme@db:5432/ml
    ports:
      - "${ML_PREDICTION_PORT:-8001}:8001"
    depends_on:
      ml-prediction-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      # Vite compiles these public URLs into the frontend bundle.
      args:
        VITE_MARKET_TRADING_API_URL: ${VITE_MARKET_TRADING_API_URL:-http://localhost:3001}
        VITE_IDENTITY_AUTH_API_URL: ${VITE_IDENTITY_AUTH_API_URL:-http://localhost:3002}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - market-trading
      - identity-auth

  data-ingestion:
    build:
      context: ./pipeline/data-ingestion
    profiles: ["pipeline"]
    environment:
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      CSE_DATASET_ARTIFACT: ${CSE_DATASET_ARTIFACT:-}
    depends_on:
      market-trading:
        condition: service_healthy

volumes:
  db-data:
