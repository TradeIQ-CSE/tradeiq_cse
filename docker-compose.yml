name: tradeiq-cse

services:
  # Single Postgres instance hosting one database per service.
  # Databases and users are created by docker/db/init.sql on first boot.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Nest API services apply their own TypeORM migrations at startup
  # (migrationsRun: true) before serving traffic. market-trading's healthcheck
  # doubles as the "market_data schema is ready" signal for the seed job.

  market-trading:
    image: tradeiq/market-trading
    build:
      context: .
      dockerfile: services/market-trading/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MARKET_TRADING_PORT: ${MARKET_TRADING_PORT:-3001}
      MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
    ports:
      - "${MARKET_TRADING_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  market-data-seed:
    build:
      context: .
      dockerfile: pipeline/data-ingestion/Dockerfile
    command: ["python", "-m", "data_ingestion.seed"]
    environment:
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      CSE_SEED_DATA_DIR: ${CSE_SEED_DATA_DIR:-}
      CSE_DATA_SOURCE_URL: ${CSE_DATA_SOURCE_URL:-}
    depends_on:
      market-trading:
        condition: service_healthy
    restart: "no"

  identity-auth:
    image: tradeiq/identity-auth
    build:
      context: .
      dockerfile: services/identity-auth/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      IDENTITY_AUTH_PORT: ${IDENTITY_AUTH_PORT:-3002}
      AUTH_DATABASE_URL: postgresql://auth:changeme@db:5432/auth
      JWT_SECRET: ${JWT_SECRET:-changeme}
    ports:
      - "${IDENTITY_AUTH_PORT:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy

  ml-prediction-migrate:
    image: tradeiq/ml-prediction
    build:
      context: .
      dockerfile: services/ml-prediction/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      ML_DATABASE_URL: postgresql://ml:changeme@db:5432/ml
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ml-prediction:
    image: tradeiq/ml-prediction
    build:
      context: .
      dockerfile: services/ml-prediction/Dockerfile
    environment:
      ML_PREDICTION_PORT: ${ML_PREDICTION_PORT:-8001}
      ML_DATABASE_URL: postgresql://ml:changeme@db:5432/ml
    ports:
      - "${ML_PREDICTION_PORT:-8001}:8001"
    depends_on:
      ml-prediction-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_MARKET_TRADING_API_URL: ${VITE_MARKET_TRADING_API_URL:-http://localhost:3001}
      VITE_IDENTITY_AUTH_API_URL: ${VITE_IDENTITY_AUTH_API_URL:-http://localhost:3002}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - market-trading
      - identity-auth

  data-ingestion:
    build:
      context: .
      dockerfile: pipeline/data-ingestion/Dockerfile
    profiles: ["pipeline"]
    environment:
      DATA_INGESTION_MARKET_DATA_DATABASE_URL: postgresql://market_data:changeme@db:5432/market_data
      CSE_DATA_SOURCE_URL: ${CSE_DATA_SOURCE_URL:-}
    depends_on:
      market-trading:
        condition: service_healthy

volumes:
  db-data:
