services:
  db:
    ports: !override
      - "127.0.0.1:${SMOKE_DB_PORT:-55432}:5432"

  market-trading:
    image: tradeiq-smoke/market-trading:${SMOKE_IMAGE_TAG:-local}
    ports: !override
      - "127.0.0.1:${SMOKE_MARKET_PORT:-53001}:3001"

  identity-auth:
    image: tradeiq-smoke/identity-auth:${SMOKE_IMAGE_TAG:-local}
    ports: !override
      - "127.0.0.1:${SMOKE_AUTH_PORT:-53002}:3002"

  ml-prediction-migrate:
    image: tradeiq-smoke/ml-prediction:${SMOKE_IMAGE_TAG:-local}

  ml-prediction:
    image: tradeiq-smoke/ml-prediction:${SMOKE_IMAGE_TAG:-local}
    ports: !override
      - "127.0.0.1:${SMOKE_ML_PORT:-58001}:8001"

  frontend:
    ports: !override
      - "127.0.0.1:${SMOKE_FRONTEND_PORT:-55173}:5173"
