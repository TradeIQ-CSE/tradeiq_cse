[project]
name = "ml-prediction"
version = "0.0.0"
description = "Batch ML predictions: the scheduled long-trade predictor and its health API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.10",
]

[dependency-groups]
dev = [
    "ruff>=0.7.4",
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]
# The scheduled long-trade job (app/long_trade, Dockerfile.long-trade). A group
# rather than a main dependency so the API image, which installs --no-dev and
# no groups, stays free of the numeric stack. Lower bounds follow
# trading-wizard's requirements.txt, where the model was researched.
long-trade = [
    "httpx>=0.27.2",
    "numpy>=2.2",
    "pandas>=3.0",
    "scikit-learn>=1.8",
    # Imported directly to cap BLAS threads; scikit-learn already depends on it.
    "threadpoolctl>=3.1",
    # The same `xgboost` module either way. On Linux the full wheel pulls in
    # nvidia-nccl-cu12 (hundreds of MB of CUDA libraries) that a CPU-only 2 GiB
    # box can never use; xgboost-cpu is the official CPU-only build.
    #
    # Capped at 3.2, the version the research ran on: with identical parameters
    # and data, 3.3+ trains a different model (test probabilities moved by up to
    # 0.74 in the parity check). Upgrading is a model change - re-run the
    # parity check and bump MODEL_VERSION in app/long_trade/repository.py.
    "xgboost-cpu>=3.2,<3.3; sys_platform == 'linux'",
    "xgboost>=3.2,<3.3; sys_platform != 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
# Copied from trading-wizard; kept diffable with upstream (see its header).
exclude = ["app/long_trade/indicator_engine.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
