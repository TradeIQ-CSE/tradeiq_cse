# How long a browser may reuse a response without asking again.
#
# `serve` sends an ETag and nothing else — no Cache-Control, no Last-Modified.
# A response with no freshness information at all is not "do not cache": each
# browser falls back to its own heuristic, and they disagree. Chromium
# revalidates, Safari does not, so a Safari that has once loaded the site can
# keep running a months-old bundle against a current API and show failures
# nobody else can reproduce. Stating the policy explicitly is what makes every
# browser behave the same.
#
# This has to live in the http context, which is why it is its own file in
# conf.d rather than part of common.conf (included inside a server block).
# The header itself is added in common.conf, at server level: an add_header in
# a location would cancel the inherited security headers for that location.
#
# Keyed on $request_uri because it is the URI as the browser sent it. $uri is
# rewritten before the response is built — /api/market/securities reaches this
# point as /securities — so a rule written against it would not match.
map $request_uri $cache_control {
    # index.html above all: it names the hashed bundles, so a stale copy pins
    # the browser to a stale app. must-revalidate rather than no-store keeps
    # the ETag useful, making the check a 304 rather than a fresh download.
    default       "no-cache";

    # Vite puts a content hash in every filename under /assets, so a given URL
    # can never change meaning. New build, new names.
    ~^/assets/    "public, max-age=31536000, immutable";
}
