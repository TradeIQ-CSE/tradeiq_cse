# One upstream per service, addressed by Compose service name over the private
# network — no service publishes a host port, so nginx is the only way in.
#
# With a single container each there is nothing to balance yet: a 2 GiB box
# cannot host replicas. Naming them here means scaling later is
# `docker compose up -d --scale market-trading=2` plus one extra `server` line,
# rather than rewriting every location block.
#
# keepalive holds connections open between nginx and the app so each request
# does not pay for a fresh TCP handshake. nginx resolves these names once at
# start-up, which is why the deploy script reloads nginx after replacing a
# container — otherwise it keeps proxying to the old, dead IP.
upstream market_trading {
    server market-trading:3001;
    keepalive 16;
}

upstream identity_auth {
    server identity-auth:3002;
    keepalive 16;
}

upstream ml_prediction {
    server ml-prediction:8001;
    keepalive 16;
}

upstream frontend_app {
    server frontend:5173;
    keepalive 16;
}
