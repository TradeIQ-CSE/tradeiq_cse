# Used until a certificate exists. Serves the site over plain HTTP and answers
# the ACME challenge so certbot can issue one.
#
# This file is what makes `docker compose up` work on a brand new box: an nginx
# config that referenced certificate files before they were issued would fail to
# start, and the stack would never come up far enough to obtain them.
include /etc/nginx/upstreams.conf;

server {
    listen 80;
    listen [::]:80;
    server_name tradeiqcse.tech www.tradeiqcse.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/common.conf;
}
