# Per-client request limits, enforced at the edge.
#
# nginx is the only way in (docker-compose.prod.yml publishes no other port)
# and it sees every replica's traffic, so this is the one place a limit is
# global: a counter inside market-trading would be per replica, and
# `--scale market-trading=2` would quietly double it.
#
# Keyed on $binary_remote_addr — the TCP peer. Nothing sits in front of this
# nginx, so that is the real client and cannot be forged. (Keying on
# X-Forwarded-For would let any client pick its own bucket.)
#
# http-context directives, so this is its own file in conf.d like cache.conf;
# the per-route `limit_req` lines live with the routes in common.conf.

# Every API call. Opening a page fires a dozen or so reads (list, charts,
# coverage, indices), so this is generous: it exists to stop scripted floods,
# not to shape normal browsing.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Password guessing. Login and sign-up only — /auth/refresh runs on every page
# load and must never be the thing that locks a signed-in user out.
limit_req_zone $binary_remote_addr zone=auth_credentials:10m rate=5r/m;

# POST /api/v1/backtests/preview is the one public route that runs the engine
# rather than reading a table (a whole backtest per request, and no account to
# attribute it to). Saved runs sit behind sign-in and only share `api`.
limit_req_zone $binary_remote_addr zone=backtest_preview:10m rate=6r/m;

limit_req_status 429;
# Rejections are logged; the delays that bursts absorb are not.
limit_req_log_level warn;
