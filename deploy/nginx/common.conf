# Shared by the bootstrap and TLS configurations so the two cannot drift.

client_max_body_size 4m;

gzip on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;
gzip_min_length 1024;
gzip_proxied any;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# The trailing slash on both sides strips the prefix: a browser request for
# /api/market/securities arrives at market-trading as /securities, which is
# where its controllers are actually mounted.
location /api/market/ {
    proxy_pass http://market_trading/;
    include /etc/nginx/proxy_params;
}

location /api/auth/ {
    proxy_pass http://identity_auth/;
    include /etc/nginx/proxy_params;
}

location /api/ml/ {
    proxy_pass http://ml_prediction/;
    include /etc/nginx/proxy_params;
    # Model inference is slower than a database read.
    proxy_read_timeout 120s;
}

# Everything else is the compiled React bundle, served by `serve -s`, which
# already rewrites unknown paths to index.html for client-side routing.
location / {
    proxy_pass http://frontend_app;
    include /etc/nginx/proxy_params;
}
