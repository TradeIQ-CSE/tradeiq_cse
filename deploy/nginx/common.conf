# Shared by the bootstrap and TLS configurations so the two cannot drift.

# Docker's embedded DNS. Resolution happens per request rather than once at
# start-up, which matters for two reasons: nginx treats an unresolvable
# `upstream` host as a fatal config error and refuses to boot, and it otherwise
# caches the address forever, so replacing a container during a deploy leaves
# nginx proxying to an IP that no longer exists.
#
# ipv6=off because Docker's resolver answers AAAA queries with NXDOMAIN, which
# nginx reports as "host not found" even when the A record is fine.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

client_max_body_size 4m;

gzip on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;
gzip_min_length 1024;
gzip_proxied any;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Freshness policy, mapped from the request path in cache.conf. Kept here at
# server level with the other headers: nginx drops every inherited add_header
# the moment one appears in a nested location.
#
# Deliberately without `always`, which is what limits it to successful and
# redirect responses. A 502 from a restarting upstream would otherwise be
# served as an immutable asset and cached for a year, turning a few seconds of
# deploy into a permanently broken page for whoever loaded it then.
add_header Cache-Control $cache_control;

# Each service is addressed by its Compose service name over the private
# network; nothing publishes a host port, so nginx is the only way in. Docker's
# DNS round-robins across replicas, so `--scale market-trading=2` balances
# across both without touching this file.
#
# The host goes in a variable deliberately: that is what defers resolution to
# request time. The cost is that `proxy_pass` with a variable no longer strips
# the location prefix, so each route rewrites the path explicitly — a request
# for /api/market/securities has to reach market-trading as /securities, which
# is where its controllers are mounted.

#
# Rate limits (zones in rate-limit.conf). Every /api/ location carries `api`;
# the stricter routes are exact-match locations, which nginx picks over the
# prefix ones, and they carry both. `nodelay` answers a burst at once instead
# of queueing it: a client inside its allowance never waits, and one over it
# gets a 429 straight away rather than a slow request.

location /api/market/ {
    limit_req zone=api burst=40 nodelay;
    set $upstream_market market-trading:3001;
    rewrite ^/api/market/(.*)$ /$1 break;
    proxy_pass http://$upstream_market;
    include /etc/nginx/proxy_params;
}

# A few previews back to back is normal (tweak a rule, run again); a steady
# stream of them is not.
location = /api/market/api/v1/backtests/preview {
    limit_req zone=api burst=40 nodelay;
    limit_req zone=backtest_preview burst=6 nodelay;
    set $upstream_market market-trading:3001;
    rewrite ^/api/market/(.*)$ /$1 break;
    proxy_pass http://$upstream_market;
    include /etc/nginx/proxy_params;
}

location /api/auth/ {
    limit_req zone=api burst=40 nodelay;
    set $upstream_auth identity-auth:3002;
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://$upstream_auth;
    include /etc/nginx/proxy_params;
}

# Credential guessing: a handful of mistyped passwords go straight through,
# then one attempt every 12 seconds.
location ~ ^/api/auth/auth/(login|signup)$ {
    limit_req zone=api burst=40 nodelay;
    limit_req zone=auth_credentials burst=5 nodelay;
    set $upstream_auth identity-auth:3002;
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://$upstream_auth;
    include /etc/nginx/proxy_params;
}

location /api/ml/ {
    limit_req zone=api burst=40 nodelay;
    set $upstream_ml ml-prediction:8001;
    rewrite ^/api/ml/(.*)$ /$1 break;
    proxy_pass http://$upstream_ml;
    include /etc/nginx/proxy_params;
    # Model inference is slower than a database read.
    proxy_read_timeout 120s;
}

# A rejected request gets the same error envelope the services use
# (docs/api/error-envelope.md), so the SPA shows its message like any other API
# error instead of trying to parse nginx's HTML page. add_header here replaces
# the inherited headers for this response, hence nosniff again.
error_page 429 = @rate_limited;
location @rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a minute and try again.","trace_id":"$request_id"}}';
}

# Everything else is the compiled React bundle, served by `serve -s`, which
# already rewrites unknown paths to index.html for client-side routing.
location / {
    set $upstream_frontend frontend:5173;
    proxy_pass http://$upstream_frontend$request_uri;
    include /etc/nginx/proxy_params;
}
