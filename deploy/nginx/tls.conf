# Used once a certificate exists. The entrypoint selects between this and
# bootstrap.conf at start-up, so a restart is what promotes the site to HTTPS
# after the first issuance.

server {
    listen 80;
    listen [::]:80;
    server_name tradeiqcse.tech www.tradeiqcse.tech;

    # Renewals re-validate over HTTP, so this has to stay reachable.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tradeiqcse.tech www.tradeiqcse.tech;

    ssl_certificate /etc/letsencrypt/live/tradeiqcse.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradeiqcse.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Six months, and only after HTTPS is known to work — a premature HSTS
    # header locks browsers out of the site if the certificate ever lapses.
    add_header Strict-Transport-Security "max-age=15768000" always;

    include /etc/nginx/common.conf;
}
