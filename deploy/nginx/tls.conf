# Used once a certificate exists. The entrypoint selects between this and
# bootstrap.conf at start-up, so a restart is what promotes the site to HTTPS
# after the first issuance.

server {
    listen 80;
    listen [::]:80;
    server_name tradeiqcse.tech www.tradeiqcse.tech;

    # Renewals re-validate over HTTP, so this has to stay reachable.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The canonical host, not $host: a plain-HTTP request for www goes straight
    # to the apex rather than to https://www, which would only be redirected
    # again.
    location / {
        return 301 https://tradeiqcse.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tradeiqcse.tech;

    ssl_certificate /etc/letsencrypt/live/tradeiqcse.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradeiqcse.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Six months, and only after HTTPS is known to work — a premature HSTS
    # header locks browsers out of the site if the certificate ever lapses.
    add_header Strict-Transport-Security "max-age=15768000" always;

    include /etc/nginx/common.conf;
}

# www resolves to this box and is on the certificate, so it has to be answered
# — but it must not serve the app. The bundle calls the API at the absolute
# origin https://tradeiqcse.tech/api/market, which is cross-origin from a www
# page, and the services allow only the apex (MARKET_TRADING_CORS_ORIGINS in
# docker-compose.prod.yml). Serving the app here renders the page and then has
# every one of its API calls blocked by CORS, so the site loads and reports it
# cannot reach an API that is in fact healthy. Safari hides the `www.` prefix
# in the address bar, which makes that a genuinely invisible failure.
#
# One canonical origin also keeps the session cookie, the HSTS entry and the
# search index in one place instead of two.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tradeiqcse.tech;

    ssl_certificate /etc/letsencrypt/live/tradeiqcse.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradeiqcse.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://tradeiqcse.tech$request_uri;
}
