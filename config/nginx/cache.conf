# Cache policy by original request URI. Hashed assets can be cached longer than HTML/API responses.
map $request_uri $cache_control {
    # index.html above all: it names the hashed bundles, so a stale copy pins
    # the browser to a stale app. must-revalidate rather than no-store keeps
    # the ETag useful, making the check a 304 rather than a fresh download.
    default       "no-cache";

    # Vite puts a content hash in every filename under /assets, so a given URL
    # can never change meaning. New build, new names.
    ~^/assets/    "public, max-age=31536000, immutable";

    # The public developer API is key-authenticated (docs/api/public-api-v1.md
    # §2): a cached response would be replayed to whoever asks next,
    # regardless of whether their key is valid, revoked, or belongs to them at
    # all. no-store, not just no-cache, so neither this proxy nor any shared
    # cache in front of it ever stores a copy to revalidate from.
    ~^/api/public/  "no-store";
}
