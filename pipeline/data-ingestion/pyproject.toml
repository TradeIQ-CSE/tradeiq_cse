[project]
name = "data-ingestion"
version = "0.0.0"
description = "Scheduled job: fetches, normalises, and validates CSE end-of-day data"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.2",
    "jsonschema>=4.23.0",
    "psycopg[binary]>=3.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.7.4",
    "pytest>=8.3.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Copied from cse-dataset; kept byte-for-byte diffable with upstream.
"src/data_ingestion/artifact.py" = ["E501", "I001", "UP035"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_ingestion"]
